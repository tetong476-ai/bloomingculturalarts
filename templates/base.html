<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ settings.get('site_title', 'Blooming Cultural Arts') }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/custom.css?v=20261122t">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bca-pink': '#FDF2F4',
            'bca-gold': '#EBB838',
            'bca-green': '#6B8F71',
          }
        }
      }
    }
  </script>
  {% block head %}{% endblock %}
</head>
<body class="bg-white text-gray-800 font-sans">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
