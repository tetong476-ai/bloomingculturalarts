<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Blooming Cultural Arts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-50 via-pink-50 to-green-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-amber-400 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg">
        B
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Blooming Cultural Arts</h1>
      <p class="text-gray-500 text-sm mt-1">Admin Panel Login</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash-msg flash-{{ category }} rounded-xl p-4 mb-4 text-sm">
        {{ message }}
      </div>
      {% endfor %}
    {% endwith %}

    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-xl p-8">
      <h2 class="text-xl font-bold text-gray-800 mb-6">Sign In</h2>
      <form method="POST" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <input type="text" name="username" required autocomplete="username"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition"
                 placeholder="Enter your username">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" name="password" required autocomplete="current-password"
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition"
                 placeholder="Enter your password">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="remember" id="remember" class="rounded text-amber-400">
          <label for="remember" class="text-sm text-gray-600">Remember me</label>
        </div>
        <button type="submit" class="w-full btn-gold py-3 rounded-xl font-semibold text-sm shadow-md">
          Sign In to Admin Panel
        </button>
      </form>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-sm text-gray-500 hover:text-amber-500 transition-colors">
        &larr; Back to Website
      </a>
    </div>
  </div>

  <script>
    // Auto-dismiss flash messages
    setTimeout(() => {
      document.querySelectorAll('.flash-msg').forEach(el => {
        el.style.transition = 'opacity 0.5s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);
  </script>
</body>
</html>
